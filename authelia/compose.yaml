---
name: authelia

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    networks:
      - proxy
    # Secrets come from .env via env_file:
    #   AUTHELIA_SESSION_SECRET
    #   AUTHELIA_STORAGE_ENCRYPTION_KEY
    #   AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    # Not published on the host — reached only through Traefik
    # NOTE: compose-level vars must NOT be named AUTHELIA_* — Authelia
    # treats every AUTHELIA_* env var as a config key override.
    expose:
      - "${PORTAL_PORT:-9091}"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
    labels:
      - traefik.enable=true
      # --- Authelia portal itself ---
      - traefik.http.routers.${ROUTER_NAME:-authelia}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${ROUTER_NAME:-authelia}.rule=Host(`${PORTAL_HOST:?set PORTAL_HOST}`)
      - traefik.http.routers.${ROUTER_NAME:-authelia}.service=${ROUTER_NAME:-authelia}
      - traefik.http.routers.${ROUTER_NAME:-authelia}.tls=true
      - traefik.http.routers.${ROUTER_NAME:-authelia}.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ROUTER_NAME:-authelia}.tls.domains[0].main=${PORTAL_HOST}
      - traefik.http.services.${ROUTER_NAME:-authelia}.loadbalancer.server.port=${PORTAL_PORT:-9091}
      # --- Shared forwardAuth middleware: other stacks just reference it ---
      # On any protected container add:
      #   - traefik.http.routers.<router-name>.middlewares=authelia@docker
      # (works as long as Traefik sees this container; middleware is defined here)
      - traefik.http.middlewares.${MIDDLEWARE_NAME:-authelia}.forwardauth.address=http://authelia:${PORTAL_PORT:-9091}/api/authz/forward-auth
      - traefik.http.middlewares.${MIDDLEWARE_NAME:-authelia}.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.${MIDDLEWARE_NAME:-authelia}.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
    healthcheck:
      # v4.39 has no 'authelia healthcheck' subcommand — probe the API instead
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # External network shared with your existing Traefik stack.
  # Create once:  docker network create proxy
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
